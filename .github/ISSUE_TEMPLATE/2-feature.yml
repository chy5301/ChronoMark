name: ✨ 功能请求
description: 提议一个新功能或改进
title: "[Feature]: "
labels: ["type: feature", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！请描述你希望解决的问题，而不仅仅是具体方案，这能帮助我们找到最合适的实现。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，确认这不是重复提议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么痛点？这个功能能解决什么？
      placeholder: 我在……时遇到不便，因为……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提议的方案
      description: 你希望它如何实现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他做法？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 事件模式
        - 秒表模式
        - 历史记录
        - 设置 / 工作区
        - UI / 主题
        - 其他 / 不确定
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考、预期收益等。
    validations:
      required: false
