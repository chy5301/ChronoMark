name: 🐛 Bug 报告
description: 报告一个缺陷，帮助我们改进 ChronoMark
title: "[Bug]: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈问题！请尽量填写以下信息，这能帮助我们更快定位并修复问题。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，确认这不是重复反馈
          required: true
        - label: 我使用的是最新版本，问题依然存在
          required: false

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述遇到的问题。
      placeholder: 当我……时，发生了……
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何一步步重现这个问题？
      placeholder: |
        1. 进入「……」页面
        2. 点击「……」
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      description: 问题主要出现在哪个部分？
      options:
        - 事件模式
        - 秒表模式
        - 历史记录
        - 设置 / 工作区
        - UI / 主题
        - 其他 / 不确定
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App 版本
      description: 可在「设置」页查看，例如 v1.1.0
      placeholder: v1.1.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: 例如 Pixel 8 / Xiaomi 14
    validations:
      required: false

  - type: input
    id: android-version
    attributes:
      label: Android 版本
      placeholder: 例如 Android 15 (SDK 35)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 截图 / 日志
      description: 如有截图、录屏或崩溃日志，请粘贴于此（日志会自动按代码块格式渲染）。
      render: shell
    validations:
      required: false
